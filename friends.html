{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأصدقاء | نظام المكافآت</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="friends.css">
</head>

<body>

    <div class="container-fluid p-0">
        <!-- Header -->
        <header class="app-header">
            <div class="support"> 
                <a href="#"><i class='bx bxl-graphql'></i> V9.5</a>
                <div class="supp">
                    <a href="https://t.me/fakeGroup10" target="_blank"><i class='bx bx-support'></i></a>
                    <a href="#"><i class='bx bxs-bell-plus'></i></a>
                </div>
            </div>
        </header>

        <!-- صورة الغلاف -->
        <section class="cover-image">
            <img src="coverFriends.jpg" alt="غلاف الأصدقاء" class="img-fluid">
        </section>

        <!-- قسم رابط الدعوة -->
        <div class="referral-section">
            <div class="card referral-card">
                <div class="card-body text-center">
                    <h2 class="card-title"><i class='bx bx-gift'></i> ادعُ أصدقاءك واكسب مكافآت</h2>
                    <p class="card-text">شارك رابطك الخاص واحصل على نقاط لكل صديق يسجل</p>
                    
 <div class="input-group mb-3">
    <input type="text" class="form-control referral-input" 
           id="referralLink" 
           value="http://127.0.0.1:8000/accounts/signup/?ref={{ request.user.fullprofile.referral_code }}" 
           readonly>
    <button class="btn btn-copy" onclick="copyLink()">
        <i class='bx bx-copy'></i> نسخ
    </button>
</div>
                    
                    <div class="share-buttons">
                        <button class="btn btn-share whatsapp" onclick="shareOnWhatsApp()">
                            <i class='bx bxl-whatsapp'></i> واتساب
                        </button>
                        <button class="btn btn-share telegram" onclick="shareOnTelegram()">
                            <i class='bx bxl-telegram'></i> تيليجرام
                        </button>
                    </div>
                    
                    <div class="alert alert-success mt-3" id="copySuccess" style="display: none;">
                        <i class='bx bx-check-circle'></i> تم نسخ الرابط بنجاح!
                    </div>
                </div>
            </div>
        </div>

        <!-- مستويات المكافآت -->
        <div class="rewards-section">
            <div class="card rewards-card">
                <div class="card-body">
                    <h3 class="section-title"><i class='bx bx-trophy'></i> نظام المكافآت</h3>
                    <p class="section-subtitle">كلما زاد عدد الأصدقاء الذين سجلوا برابطك، زادت مكافآتك!</p>
                    
                    <div class="levels-container">

                    <a href="{% url 'referrals' %}" class="coloring">
                        <div class="level-card level-1">
                            <div class="level-icon">
                                <img src="friends.png" alt="" width="30">
                            </div>
                            <h4> الأصدقاء من جميع المستويات</h4>
                            <p class="friends-count">0 <span>أصدقاء مباشرين</span></p>
                         
                        </div>
                    </a>
                        

                    
        </div>

        <!-- Footer -->
        <div class="footer-nav">
            <a href="index.html" class="nav-item {% if request.resolver_match.url_name == 'index' %}active{% endif %}">
                <i class='bx bxs-home'></i>
                <span>الرئيسية</span>
            </a>
            <a href="tasks.html" class="nav-item {% if request.resolver_match.url_name == 'tasks' %}active{% endif %}">
                <i class='bx bx-customize'></i>
                <span>المهام</span>
            </a>
            <a href="friends.html" class="nav-item {% if request.resolver_match.url_name == 'friends' %}active{% endif %}">
                <i class='bx bxs-group'></i>
                <span>الأصدقاء</span>
            </a>
            <a href="profile.html" class="nav-item {% if request.resolver_match.url_name == 'profile' %}active{% endif %}">
                <i class='bx bxs-user-circle'></i>
                <span>حسابي</span>
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="friends.js"></script>

</body>
</html>
