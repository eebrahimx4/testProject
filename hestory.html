
{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل العمليات المالية</title>
    <link rel="stylesheet" href="{% static 'css/hestory.css' %}">
</head>
<body>


    {% block content %}
    <div class="container">

 <!-- Header -->
 <header>
    <div class="support"> 
        <a href="{% url 'profile' %}"><i class='bx bxl-graphql'></i>back</a>
    </div>
</header>




        <h1>سجل المعاملات المالية</h1>
        
        <!-- أزرار التبديل بين الإيداع والسحب -->
        <div class="tabs">
            <button class="tab-btn active" onclick="showTab('deposits')">الإيداعات</button>
            <button class="tab-btn" onclick="showTab('withdrawals')">السحوبات</button>
        </div>
        
        <!-- قسم الإيداعات -->
        <div id="deposits" class="tab-content active">
            <h2>آخر عمليات الإيداع</h2>
            <div id="deposits-list" class="transactions-list">
                <!-- البيانات ستضاف هنا عبر JavaScript -->
            </div>
        </div>
        
        <!-- قسم السحوبات -->
        <div id="withdrawals" class="tab-content">
            <h2>آخر عمليات السحب</h2>
            <div id="withdrawals-list" class="transactions-list">
                <!-- البيانات ستضاف هنا عبر JavaScript -->
            </div>
        </div>
    </div>



    <script src="{% static 'js/hestory.js' %}"></script>
    {% endblock %}
    
</body>
</html>
