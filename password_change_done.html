


{% block content %}

<div class="password-change-success-container">
    <div class="success-card">
        <div class="success-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#4BB543" viewBox="0 0 16 16">
                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
            </svg>
        </div>
        <h2 class="success-title">تم تغيير كلمة المرور بنجاح!</h2>
        <p class="success-message">تم تحديث كلمة المرور الخاصة بك بنجاح. يمكنك الآن استخدام كلمة المرور الجديدة لتسجيل الدخول.</p>
        
        <div class="success-actions">
            <a href="{% url 'index' %}" class="home-btn">
                <i class="fas fa-home"></i> العودة للرئيسية
            </a>
            <a href="{% url 'login' %}" class="login-btn">
                <i class="fas fa-sign-in-alt"></i> تسجيل الدخول
            </a>
        </div>
    </div>
</div>

<style>
    .password-change-success-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
        padding: 20px;

  }
    
    .success-card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 40px;
        text-align: center;
        max-width: 500px;
        width: 100%;
        transform: translateY(0);
        animation: fadeInUp 0.6s ease;
        overflow: hidden;

    }
    
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .success-icon {
        margin-bottom: 25px;
        animation: bounce 1s ease;
    }
    
    @keyframes bounce {
        0%, 20%, 50%, 80%, 100% {
            transform: translateY(0);
        }
        40% {
            transform: translateY(-20px);
        }
        60% {
            transform: translateY(-10px);
        }
    }
    
    .success-title {
        color: #2e3a4d;
        margin-bottom: 15px;
        font-weight: 700;
    }
    
    .success-message {
        color: #6c757d;
        font-size: 1.05rem;
        line-height: 1.6;
        margin-bottom: 30px;
    }
    
    .success-actions {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
    }
    
    .home-btn, .login-btn {
        padding: 12px 25px;
        border-radius: 8px;
        font-weight: 500;
        text-decoration: none;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;

    }
    
    .home-btn {
        background-color: #4361ee;
        color: white;
        border: 2px solid #4361ee;
    }
    
    .home-btn:hover {
        background-color: #3a56d4;
        border-color: #3a56d4;
        transform: translateY(-2px);
    }
    
    .login-btn {
        background-color: white;
        color: #4361ee;
        border: 2px solid #4361ee;
    }
    
    .login-btn:hover {
        background-color: #f0f3ff;
        transform: translateY(-2px);
    }
    
    /* للجوال */
    @media (max-width: 576px) {
        .success-card {
            padding: 30px 20px;
        }
        
        .success-actions {
            flex-direction: column;
            gap: 10px;
        }
        
        .home-btn, .login-btn {
            width: 100%;
            justify-content: center;
        }
    }
</style>

{% endblock content %}
